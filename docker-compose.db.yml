# nexos — banco (Postgres + pgvector). Um só, serve produção e dev.
#
# Volume com nome FIXO de propósito: é o mesmo dado que o serviço atual usa
# (`nexos_data`). Não renomeie — renomear aqui = subir banco vazio.
services:
  nexos-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexos}}
      POSTGRES_PASSWORD: ${NEXOS_DB_PASSWORD:-${MINIRAG_DB_PASSWORD:-nexos}}
      POSTGRES_DB: ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexos}}
    volumes:
      - nexos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexos}} -d ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexos}}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - minirag-rede

volumes:
  nexos_data:
    name: nexos_data

networks:
  minirag-rede:
    name: minirag-rede
    driver: bridge