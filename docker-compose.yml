# RAG service — Postgres(pgvector) + FastAPI + nomic-embed-text
# 2 containers: minirag-db (banco) + minirag-api (serviço, porta local por padrão)
#
# Para usar com Dokploy: crie um projeto "docker", aponte pra essa pasta,
# e preencha as variáveis na aba Environment (ou num .env):
#   MINIRAG_DB_USER / MINIRAG_DB_PASSWORD  (senha do banco; mesma nos dois serviços)
#   MINIRAG_CORS_ORIGINS               (ex.: https://seudominio.com)
# A chave inicial sai no log do container (linha "CHAVE INICIAL").

services:
  minirag-db:
    image: pgvector/pgvector:pg17
    container_name: minirag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MINIRAG_DB_USER:-minirag}
      POSTGRES_PASSWORD: ${MINIRAG_DB_PASSWORD:-minirag}
      POSTGRES_DB: ${MINIRAG_DB_NAME:-minirag}
    volumes:
      - minirag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINIRAG_DB_USER:-minirag} -d ${MINIRAG_DB_NAME:-minirag}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  minirag-api:
    build: .
    container_name: minirag-api
    restart: unless-stopped
    environment:
      MINIRAG_MODEL: ${MINIRAG_MODEL:-nomic-ai/nomic-embed-text}
      MINIRAG_MODEL_DIR: /app/models
      MINIRAG_DB_HOST: minirag-db
      MINIRAG_DB_PORT: "5432"
      MINIRAG_DB_USER: ${MINIRAG_DB_USER:-minirag}
      MINIRAG_DB_PASSWORD: ${MINIRAG_DB_PASSWORD:-minirag}
      MINIRAG_DB_NAME: ${MINIRAG_DB_NAME:-minirag}
      MINIRAG_MAX_CHUNK_WORDS: ${MINIRAG_MAX_CHUNK_WORDS:-500}
      MINIRAG_CHUNK_OVERLAP: ${MINIRAG_CHUNK_OVERLAP:-80}
      MINIRAG_TOP_K: ${MINIRAG_TOP_K:-5}
      MINIRAG_MIN_SCORE: ${MINIRAG_MIN_SCORE:-0.55}
      MINIRAG_CORS_ORIGINS: ${MINIRAG_CORS_ORIGINS:-}
    depends_on:
      minirag-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    ports:
      # Só localhost por padrão; expõe pra internet via seu proxy/Dokploy,
      # não no host direto.
      - "127.0.0.1:8000:8000"

volumes:
  minirag_data:
