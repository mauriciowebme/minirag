# RAG service v2 — Postgres(pgvector) + Node/TypeScript (embedder Python dentro)
# 2 containers: minirag-db (banco) + minirag-api (serviço: Node + Python filho)
#
# Acesso: domínio público via Traefik do Dokploy (minirag.techupsistemas.com,
# HTTPS) + ports locais 127.0.0.1 e tailnet no api (ver seção ports:).
# Sem container_name — no Dokploy ele some com os logs/métricas do painel.
#
# Para usar com Dokploy: crie um projeto "docker", aponte pra esse repo
# (branch main), e preencha as variáveis na aba Environment (ou num .env):
#   MINIRAG_DB_USER / MINIRAG_DB_PASSWORD  (senha do banco; mesma nos dois serviços)
#   MINIRAG_USERS                    lista "nome:chave" separada por vírgula —
#                                    cada nome é um tenant com memória própria
#   MINIRAG_OPERADOR                 (v1.8) "nome:chave" — chave global do dono:
#                                    vê todas as gavetas (painel /painel)
#   MINIRAG_CORS_ORIGINS               (ex.: https://seudominio.com)

services:
  minirag-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MINIRAG_DB_USER:-minirag}
      POSTGRES_PASSWORD: ${MINIRAG_DB_PASSWORD:-minirag}
      POSTGRES_DB: ${MINIRAG_DB_NAME:-minirag}
    volumes:
      - minirag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINIRAG_DB_USER:-minirag} -d ${MINIRAG_DB_NAME:-minirag}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  minirag-api:
    build: .
    # always (e nao unless-stopped): se o boot derrubar a API, o Docker tenta
    # de novo mesmo depois de restart do daemon — nunca fica "parado esperando
    # mao", que e o estado que a faxina de prune apaga sem deixar rastro.
    restart: always
    environment:
      # stdout sem buffer: log de boot aparece no docker logs / no painel
      PYTHONUNBUFFERED: "1"
      MINIRAG_MODEL: ${MINIRAG_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      MINIRAG_MODEL_DIR: /app/models
      MINIRAG_DB_HOST: minirag-db
      MINIRAG_DB_PORT: "5432"
      MINIRAG_DB_USER: ${MINIRAG_DB_USER:-minirag}
      MINIRAG_DB_PASSWORD: ${MINIRAG_DB_PASSWORD:-minirag}
      MINIRAG_DB_NAME: ${MINIRAG_DB_NAME:-minirag}
      # espera o banco no boot (no do host o Docker religa sem depends_on)
      MINIRAG_DB_WAIT_TRIES: ${MINIRAG_DB_WAIT_TRIES:-30}
      MINIRAG_DB_WAIT_SECONDS: ${MINIRAG_DB_WAIT_SECONDS:-2}
      MINIRAG_MAX_CHUNK_WORDS: ${MINIRAG_MAX_CHUNK_WORDS:-500}
      MINIRAG_CHUNK_OVERLAP: ${MINIRAG_CHUNK_OVERLAP:-80}
      MINIRAG_TOP_K: ${MINIRAG_TOP_K:-5}
      MINIRAG_MIN_SCORE: ${MINIRAG_MIN_SCORE:-0.55}
      # Limites de seguranca (uso normal nunca estoura)
      MINIRAG_MAX_CONTENT_CHARS: ${MINIRAG_MAX_CONTENT_CHARS:-500000}
      MINIRAG_MAX_QUERY_CHARS: ${MINIRAG_MAX_QUERY_CHARS:-2000}
      MINIRAG_MAX_CHUNKS_TENANT: ${MINIRAG_MAX_CHUNKS_TENANT:-10000}
      # Memoria inteligente (decay): arquiva DOCUMENTO pouco usado (soma dos
      # acessos dos chunks do doc) ha N dias; reversivel (busca com
      # include_archived acha e revive o documento inteiro)
      MINIRAG_DECAY_ATIVO: ${MINIRAG_DECAY_ATIVO:-1}
      MINIRAG_DECAY_DIAS: ${MINIRAG_DECAY_DIAS:-30}
      MINIRAG_DECAY_MIN_ACESSOS: ${MINIRAG_DECAY_MIN_ACESSOS:-2}
      MINIRAG_DECAY_INTERVALO_MINUTOS: ${MINIRAG_DECAY_INTERVALO_MINUTOS:-60}
      MINIRAG_USERS: ${MINIRAG_USERS:-}
      # v2: embedder Python roda DENTRO deste container, em 127.0.0.1:8001
      # (filho do Node). "externo" só para desenvolvimento fora do Docker.
      MINIRAG_EMBEDDER_MODO: ${MINIRAG_EMBEDDER_MODO:-filho}
      MINIRAG_EMBEDDER_PORT: ${MINIRAG_EMBEDDER_PORT:-8001}
      # v1.8: chave(s) de operador "nome:chave" — veem TODAS as gavetas e
      # operam em tenant alheio (?tenant=). Login comum permanece por-tenant.
      MINIRAG_OPERADOR: ${MINIRAG_OPERADOR:-}
      MINIRAG_CORS_ORIGINS: ${MINIRAG_CORS_ORIGINS:-}
    depends_on:
      minirag-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    expose:
      - "8000"
    ports:
      # Acesso por domínio (Traefik, HTTPS) + os dois caminhos locais que o
      # IA_GO já usa hoje: localhost do host e o IP da tailnet (o backend de
      # produção/dev aponta para http://100.64.0.5:8000). Nunca 0.0.0.0.
      - "127.0.0.1:8000:8000"
      - "100.64.0.5:8000:8000"

volumes:
  minirag_data:
