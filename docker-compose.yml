# RAG service v2 — Postgres(pgvector) + Node/TypeScript (embedder Python dentro)
# 2 containers: nexos-db (banco) + nexos (serviço: Node + Python filho)
#
# Acesso: domínio público via Traefik do Dokploy (nexos.techupsistemas.com,
# HTTPS) + ports locais 127.0.0.1 e tailnet no api (ver seção ports:).
# Sem container_name — no Dokploy ele some com os logs/métricas do painel.
#
# Para usar com Dokploy: crie um projeto "docker", aponte pra esse repo
# (branch main), e preencha as variáveis na aba Environment (ou num .env):
#   MINIRAG_DB_USER / MINIRAG_DB_PASSWORD  (senha do banco; mesma nos dois serviços)
#   MINIRAG_USERS                    lista "nome:chave" separada por vírgula —
#                                    cada nome é um tenant com memória própria.
#                                    POLÍTICA (v3.2.3): deixe VAZIO em produção. O env é
#                                    só semente do primeiro boot; usuário comum nasce na
#                                    tela "Usuários", criado pelo admin.
#   MINIRAG_ADMIN                  (v1.8 como OPERADOR, v3.4 renomeada) "nome:chave" —
#                                    vê todas as gavetas (painel /painel).
#                                    (v3.2.3) é a ÚNICA conta vinda do env, e o sistema
#                                    recusa apagar o último operador ativo.
#   MINIRAG_CORS_ORIGINS               (ex.: https://seudominio.com)

services:
  nexos-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexos}}
      POSTGRES_PASSWORD: ${NEXOS_DB_PASSWORD:-${MINIRAG_DB_PASSWORD:-nexos}}
      POSTGRES_DB: ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexos}}
    volumes:
      - nexos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexos}} -d ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexos}}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  nexos:
    build: .
    # always (e nao unless-stopped): se o boot derrubar a API, o Docker tenta
    # de novo mesmo depois de restart do daemon — nunca fica "parado esperando
    # mao", que e o estado que a faxina de prune apaga sem deixar rastro.
    restart: always
    environment:
      # stdout sem buffer: log de boot aparece no docker logs / no painel
      PYTHONUNBUFFERED: "1"
      NEXOS_MODEL: ${NEXOS_MODEL:-${MINIRAG_MODEL:-nomic-ai/nomic-embed-text-v1.5}}
      NEXOS_MODEL_DIR: /app/models
      NEXOS_DB_HOST: nexos-db
      NEXOS_DB_PORT: "5432"
      NEXOS_DB_USER: ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexos}}
      NEXOS_DB_PASSWORD: ${NEXOS_DB_PASSWORD:-${MINIRAG_DB_PASSWORD:-nexos}}
      NEXOS_DB_NAME: ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexos}}
      # espera o banco no boot (no do host o Docker religa sem depends_on)
      NEXOS_DB_WAIT_TRIES: ${NEXOS_DB_WAIT_TRIES:-${MINIRAG_DB_WAIT_TRIES:-30}}
      NEXOS_DB_WAIT_SECONDS: ${NEXOS_DB_WAIT_SECONDS:-${MINIRAG_DB_WAIT_SECONDS:-2}}
      NEXOS_MAX_CHUNK_WORDS: ${NEXOS_MAX_CHUNK_WORDS:-${MINIRAG_MAX_CHUNK_WORDS:-500}}
      NEXOS_CHUNK_OVERLAP: ${NEXOS_CHUNK_OVERLAP:-${MINIRAG_CHUNK_OVERLAP:-80}}
      NEXOS_TOP_K: ${NEXOS_TOP_K:-${MINIRAG_TOP_K:-5}}
      NEXOS_MIN_SCORE: ${NEXOS_MIN_SCORE:-${MINIRAG_MIN_SCORE:-0.55}}
      # Limites de seguranca (uso normal nunca estoura)
      NEXOS_MAX_CONTENT_CHARS: ${NEXOS_MAX_CONTENT_CHARS:-${MINIRAG_MAX_CONTENT_CHARS:-500000}}
      NEXOS_MAX_QUERY_CHARS: ${NEXOS_MAX_QUERY_CHARS:-${MINIRAG_MAX_QUERY_CHARS:-2000}}
      NEXOS_MAX_CHUNKS_TENANT: ${NEXOS_MAX_CHUNKS_TENANT:-${MINIRAG_MAX_CHUNKS_TENANT:-10000}}
      # Memoria inteligente (decay): arquiva DOCUMENTO pouco usado (soma dos
      # acessos dos chunks do doc) ha N dias; reversivel (busca com
      # include_archived acha e revive o documento inteiro)
      NEXOS_DECAY_ATIVO: ${NEXOS_DECAY_ATIVO:-${MINIRAG_DECAY_ATIVO:-1}}
      NEXOS_DECAY_DIAS: ${NEXOS_DECAY_DIAS:-${MINIRAG_DECAY_DIAS:-30}}
      NEXOS_DECAY_MIN_ACESSOS: ${NEXOS_DECAY_MIN_ACESSOS:-${MINIRAG_DECAY_MIN_ACESSOS:-2}}
      NEXOS_DECAY_INTERVALO_MINUTOS: ${NEXOS_DECAY_INTERVALO_MINUTOS:-${MINIRAG_DECAY_INTERVALO_MINUTOS:-60}}
      NEXOS_USERS: ${NEXOS_USERS:-${MINIRAG_USERS:-}}
      # v2: embedder Python roda DENTRO deste container, em 127.0.0.1:8001
      # (filho do Node). "externo" só para desenvolvimento fora do Docker.
      NEXOS_EMBEDDER_MODO: ${NEXOS_EMBEDDER_MODO:-${MINIRAG_EMBEDDER_MODO:-filho}}
      NEXOS_EMBEDDER_PORT: ${NEXOS_EMBEDDER_PORT:-${MINIRAG_EMBEDDER_PORT:-8001}}
      # v1.8: chave(s) de operador "nome:chave" — veem TODAS as gavetas e
      # operam em tenant alheio (?tenant=). Login comum permanece por-tenant.
      NEXOS_ADMIN: ${NEXOS_ADMIN:-${MINIRAG_ADMIN:-}}
      NEXOS_OPERADOR: ${NEXOS_OPERADOR:-${MINIRAG_OPERADOR:-}}
      NEXOS_CORS_ORIGINS: ${NEXOS_CORS_ORIGINS:-${MINIRAG_CORS_ORIGINS:-}}
      # v3.45: pasta dos arquivos que as máquinas mandam (volume por usuário)
      NEXOS_ARQUIVOS_DIR: ${NEXOS_ARQUIVOS_DIR:-${MINIRAG_ARQUIVOS_DIR:-/app/dados/anexos}}
      NEXOS_MAX_ARQUIVO_MB: ${NEXOS_MAX_ARQUIVO_MB:-${MINIRAG_MAX_ARQUIVO_MB:-10240}}
      NEXOS_ARQUIVOS_DIAS: ${NEXOS_ARQUIVOS_DIAS:-${MINIRAG_ARQUIVOS_DIAS:-7}}
    depends_on:
      nexos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    volumes:
      # v3.45: arquivos que as máquinas mandam (print, vídeo, backup) moram AQUI,
      # em subpasta por usuário. Volume nomeado: sobrevive a redeploy/restart.
      # v3.45: volume NOMEADO (o Docker cuida; não aponta para pasta do host).
      # A API roda como root na imagem, então cria /app/dados/anexos na 1a subida.
      - nexos_arquivos:/app/dados
    expose:
      - "8000"
    ports:
      # Acesso por domínio (Traefik, HTTPS) + os dois caminhos locais que o
      # IA_GO já usa hoje: localhost do host e o IP da tailnet (o backend de
      # produção/dev aponta para http://100.64.0.5:8000). Nunca 0.0.0.0.
      - "127.0.0.1:8000:8000"
      - "100.64.0.5:8000:8000"

volumes:
  nexos_data:
  nexos_arquivos:
