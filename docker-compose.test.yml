# TESTE LOCAL ISOLADO — sobe o nexos (build do repo atual) num projeto
# separado (volume/rede proprios) e porta LOCAL 8001, sem encostar no
# servico de producao do Dokploy (que ocupa 8000).
#
# Uso (chave do tenant de teste vem do ambiente):
#   NEXOS_USERS="teste:<chave>" \
#   /opt/data/.local/bin/docker-compose -p nexostest \
#     -f docker-compose.test.yml up -d --build
#   ... testar ...
#   /opt/data/.local/bin/docker-compose -p nexostest -f docker-compose.test.yml down -v

services:
  nexos-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexostest}}
      POSTGRES_PASSWORD: ${NEXOS_DB_PASSWORD:-${MINIRAG_DB_PASSWORD:-nexostest}}
      POSTGRES_DB: ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexostest}}
    volumes:
      - nexostest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexostest}} -d ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexostest}}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  nexos-api:
    build: .
    environment:
      PYTHONUNBUFFERED: "1"
      NEXOS_MODEL_DIR: /app/models
      NEXOS_DB_HOST: nexos-db
      NEXOS_DB_PORT: "5432"
      NEXOS_DB_USER: ${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexostest}}
      NEXOS_DB_PASSWORD: ${NEXOS_DB_PASSWORD:-${MINIRAG_DB_PASSWORD:-nexostest}}
      NEXOS_DB_NAME: ${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexostest}}
      NEXOS_DB_WAIT_TRIES: ${NEXOS_DB_WAIT_TRIES:-${MINIRAG_DB_WAIT_TRIES:-30}}
      NEXOS_DB_WAIT_SECONDS: ${NEXOS_DB_WAIT_SECONDS:-${MINIRAG_DB_WAIT_SECONDS:-2}}
      NEXOS_USERS: ${NEXOS_USERS:-${MINIRAG_USERS:-}}
      NEXOS_ADMIN: ${NEXOS_ADMIN:-${MINIRAG_ADMIN:-}}
      NEXOS_OPERADOR: ${NEXOS_OPERADOR:-${MINIRAG_OPERADOR:-}}
    depends_on:
      nexos-db:
        condition: service_healthy
    volumes:
      # v3.45: mesma forma da produção — arquivos por usuário num volume nomeado
      - nexostest_arquivos:/app/dados
    ports:
      # bind configurável: no host 127.0.0.1 basta; de dentro de outro
      # container (CI/Hermes) use 0.0.0.0 e acesse pelo IP da ponte
      - "${NEXOS_TEST_BIND:-${MINIRAG_TEST_BIND:-127.0.0.1}}:${NEXOS_TEST_PORT:-${MINIRAG_TEST_PORT:-8001}}:8000"

volumes:
  nexostest_data:
  nexostest_arquivos:
