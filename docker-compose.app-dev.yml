# minirag — app de DESENVOLVIMENTO (código montado + watch), mesmo banco.
#
# Sobe a MESMA imagem de produção, mas:
#   - `src/`, `frontend/src` e `dist` vêm do host (edita e o watch recompila)
#   - `tsc --watch` roda em segundo plano; `node --watch` reinicia o serviço
#   - o embedder continua embutido (filho do Node), igual em produção
#
# Uso: docker compose -f docker-compose.app-dev.yml up
# (o banco é o de docker-compose.db.yml — não existe banco de dev)
services:
  minirag-api-dev:
    build: .
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        ./node_modules/.bin/tsc -p tsconfig.json --watch --preserveWatchOutput &
        node --watch dist/index.js
    environment:
      NODE_ENV: development
      PYTHONUNBUFFERED: "1"
      MINIRAG_MODEL: ${MINIRAG_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      MINIRAG_MODEL_DIR: /app/models
      MINIRAG_DB_HOST: minirag-db
      MINIRAG_DB_PORT: "5432"
      MINIRAG_DB_USER: ${MINIRAG_DB_USER:-minirag}
      MINIRAG_DB_PASSWORD: ${MINIRAG_DB_PASSWORD:-minirag}
      MINIRAG_DB_NAME: ${MINIRAG_DB_NAME:-minirag}
      MINIRAG_USERS: ${MINIRAG_USERS:-}
      MINIRAG_OPERADOR: ${MINIRAG_OPERADOR:-}
      MINIRAG_EMBEDDER_MODO: filho
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./frontend/dist:/app/frontend/dist
    expose:
      - "8000"
    ports:
      - "127.0.0.1:3000:8000"
    networks:
      - minirag-rede

networks:
  minirag-rede:
    name: minirag-rede
    external: true