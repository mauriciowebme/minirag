# nexos — app de DESENVOLVIMENTO (código montado + watch), mesmo banco.
#
# Sobe a MESMA imagem de produção, mas:
#   - `src/`, `frontend/src` e `dist` vêm do host (edita e o watch recompila)
#   - `tsc --watch` roda em segundo plano; `node --watch` reinicia o serviço
#   - o embedder continua embutido (filho do Node), igual em produção
#
# Uso: docker compose -f docker-compose.app-dev.yml up
# (o banco é o de docker-compose.db.yml — não existe banco de dev)
services:
  nexos-dev:
    build: .
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        ./node_modules/.bin/tsc -p tsconfig.json --watch --preserveWatchOutput &
        node --watch dist/index.js
    environment:
      NODE_ENV: development
      PYTHONUNBUFFERED: "1"
      NEXOS_MODEL: ${NEXOS_MODEL:-${MINIRAG_MODEL:-nomic-ai/nomic-embed-text-v1.5}}
      NEXOS_MODEL_DIR: /app/models
      NEXOS_DB_HOST: nexos-db
      NEXOS_DB_PORT: "5432"
      NEXOS_DB_USER: ${NEXOS_DB_USER:-${NEXOS_DB_USER:-${MINIRAG_DB_USER:-nexos}}}
      NEXOS_DB_PASSWORD: ${NEXOS_DB_PASSWORD:-${NEXOS_DB_PASSWORD:-${MINIRAG_DB_PASSWORD:-nexos}}}
      NEXOS_DB_NAME: ${NEXOS_DB_NAME:-${NEXOS_DB_NAME:-${MINIRAG_DB_NAME:-nexos}}}
      NEXOS_USERS: ${NEXOS_USERS:-${MINIRAG_USERS:-}}
      NEXOS_ADMIN: ${NEXOS_ADMIN:-${MINIRAG_ADMIN:-}}
      NEXOS_OPERADOR: ${NEXOS_OPERADOR:-${MINIRAG_OPERADOR:-}}
      NEXOS_EMBEDDER_MODO: filho
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./frontend/dist:/app/frontend/dist
    expose:
      - "8000"
    ports:
      - "127.0.0.1:3000:8000"
    networks:
      - minirag-rede

networks:
  minirag-rede:
    name: minirag-rede
    external: true